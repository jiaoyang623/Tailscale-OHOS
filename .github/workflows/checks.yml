name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 先跑检查器自测，再跑项目门禁。自测失败时门禁结果不可信。
      - name: Run the vendored checker self-tests
        run: node scripts/a01/check-oracles.cjs --self-test

      # A01_SKILL_DIR 指向仓内副本，CI 不需要作者的本地技能目录。
      - name: Run the gate
        run: A01_SKILL_DIR=scripts/a01 bash scripts/run-checks.sh
